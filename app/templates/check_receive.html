{% extends "base.html" %}
{% block title %}바로 확인 중 | AI 정보카드{% endblock %}
{% block content %}
<section class="page-head" id="wait">
  <h1>제품 페이지를 받는 중입니다</h1>
  <p class="lede" id="msg" role="status" aria-live="polite">쇼핑몰에서 보낸 상품 설명을 기다리고 있습니다.</p>
  <p><a href="/check" class="btn">바로 확인으로 돌아가기</a></p>
</section>
<div id="out" class="narrow"></div>
<script>
(function(){
  let started = false;
  const timer = setTimeout(() => {
    if (!started) document.getElementById('msg').textContent = '상품 설명이 도착하지 않았습니다. 상품 페이지에서 상세 설명을 펼친 뒤 즐겨찾기의 ‘AI 정보카드로 확인’을 다시 눌러 주세요. 판매처 보안 설정에 따라 전송이 제한될 수 있습니다.';
  }, 15000);
  window.addEventListener('message', async (e) => {
    if (started || !window.opener || e.source !== window.opener || !e.data || e.data.type !== 'aicard-capture') return;
    try { if (new URL(e.data.url).origin !== e.origin || !/^https?:$/.test(new URL(e.data.url).protocol)) return; } catch (_) { return; }
    started = true; clearTimeout(timer);
    document.getElementById('msg').textContent = '상품 설명을 받았습니다. 상세 이미지의 글자도 읽고 있습니다. 자료를 받은 뒤 약 1~2분 안에 읽은 내용부터 보여 드립니다.';
    const controller = new AbortController();
    const deadline = setTimeout(() => controller.abort(), 115000);
    try {
    const r = await fetch('/api/check', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(e.data), signal:controller.signal});
    if (!r.ok) { let detail; try { detail = (await r.json()).detail; } catch (_) {} throw new Error(typeof detail === 'string' ? detail : '확인하지 못했습니다. 잠시 뒤 상품 페이지에서 다시 눌러 주세요.'); }
    const html = await r.text();
    const m = html.match(/location\.replace\("([^"]+)"\)/); if (m) { location.replace(m[1]); return; }
    document.getElementById('out').innerHTML = html;
    document.getElementById('wait').hidden = true;
    } catch (error) {
      const card = document.createElement('article'); card.className = 'label quick recovery-card'; card.setAttribute('role','status');
      const title = document.createElement('h2'); title.textContent = '자료 확인 필요'; card.appendChild(title);
      const text = document.createElement('p'); text.textContent = (error.name === 'AbortError' ? '제한 시간 안에 서버 응답을 받지 못했습니다.' : '상품 설명 확인을 완료하지 못했습니다.') + ' 분석을 완료한 카드가 아닙니다. 사진·PDF를 올리거나 관리자에게 링크 확인을 요청할 수 있습니다.'; card.appendChild(text);
      const search = document.createElement('a'); search.className = 'btn primary'; search.textContent = '제품명으로 기존 카드 찾기'; search.href = '/check/find?q=' + encodeURIComponent(e.data.title || '') + '&url=' + encodeURIComponent(e.data.url); card.appendChild(search);
      for (const [label, hash] of [['사진·PDF로 확인','#drop'],['관리자에게 링크 확인 요청','#link-review-request']]) {
        const link = document.createElement('a'); link.className = 'btn'; link.textContent = label; link.href = '/check?url=' + encodeURIComponent(e.data.url) + hash; card.appendChild(link);
      }
      document.getElementById('out').appendChild(card); document.getElementById('wait').hidden = true;
    } finally { clearTimeout(deadline); }
  });
  if (window.opener) window.opener.postMessage('aicard-ready', '*');
})();
</script>
{% endblock %}
