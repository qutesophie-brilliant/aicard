{% extends "base.html" %}
{% block title %}요청을 받았습니다 | AI 정보카드{% endblock %}
{% block content %}
<section class="page-head">
  <h1>요청을 받았습니다</h1>
  <p class="lede">{{ pname }} 카드 요청을 접수했습니다. 접수번호는 {{ rid }}번입니다. 검토자가 판매페이지·설명서·공공 DB 등 관련 자료를 확인한 뒤 공개 여부를 결정합니다. 처리 기간은 요청량과 자료 확보 상황에 따라 달라집니다.</p>
</section>
<div class="tools" style="margin:16px 0 60px">
  <a class="btn primary" href="/#find">제품 카드 보기</a>
  <a class="btn" href="/check">다른 제품 확인하기</a>
</div>
{% endblock %}
