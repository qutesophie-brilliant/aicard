<article class="label quick recovery-card" aria-label="자료 확인 상태 카드" data-analysis-status="draft-unverified">
  <div class="lb-band"><span class="lb-brand">바로 확인</span><span class="lb-cat">임시 카드 · 미검토</span></div>
  <h2>{{ pname or '입력한 제품 자료' }}</h2>
  <p>{{ error }}</p>
  {% include '_check_draft_fields.html' %}
  <a class="btn primary" href="/check/find?q={{ (pname or '')|urlencode }}&amp;url={{ url|urlencode }}">제품명으로 기존 카드 찾기</a>
  <a class="btn" href="/check?url={{ url|urlencode }}#drop">사진·PDF로 계속하기</a>
  <a class="btn" href="/check?url={{ url|urlencode }}#link-review-request">관리자에게 링크 확인 요청</a>
</article>
